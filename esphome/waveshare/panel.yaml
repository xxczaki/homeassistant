sensor:
- platform: homeassistant
  id: ha_power
  entity_id: sensor.shellypro3em_00700743391c_power
  internal: true
- platform: homeassistant
  id: ha_phase_a
  entity_id: sensor.shellypro3em_00700743391c_phase_a_power
  internal: true
- platform: homeassistant
  id: ha_phase_b
  entity_id: sensor.shellypro3em_00700743391c_phase_b_power
  internal: true
- platform: homeassistant
  id: ha_phase_c
  entity_id: sensor.shellypro3em_00700743391c_phase_c_power
  internal: true
- platform: homeassistant
  id: ha_import
  entity_id: sensor.shellypro3em_00700743391c_energy
  internal: true
- platform: homeassistant
  id: ha_export
  entity_id: sensor.shellypro3em_00700743391c_energy_returned
  internal: true
- platform: homeassistant
  id: ha_grace
  entity_id: input_number.presence_grace_seconds
  internal: true
- platform: homeassistant
  id: ha_lux
  entity_id: sensor.living_room_motion_illuminance
  internal: true
- platform: homeassistant
  id: ha_threshold
  entity_id: input_number.light_on_lux_threshold
  internal: true
text_sensor:
- platform: homeassistant
  id: state_auto_button
  entity_id: input_boolean.presence_enabled
  internal: true
- platform: homeassistant
  id: state_living
  entity_id: light.living_room
  internal: true
- platform: homeassistant
