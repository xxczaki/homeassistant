  internal: true
- platform: homeassistant
  id: state_bath
  entity_id: light.bathroom_light
  internal: true
- platform: homeassistant
  id: state_laundry
  entity_id: light.laundry_room_light
  internal: true
- platform: homeassistant
  id: state_balcony
  entity_id: switch.balcony_switch_l1
  internal: true
- platform: homeassistant
  id: ha_location
  entity_id: sensor.current_location
  internal: true
- platform: homeassistant
  id: ha_room
  entity_id: input_select.current_room
  internal: true
- platform: homeassistant
  id: ha_motion_living_room
  entity_id: binary_sensor.living_room_motion_occupancy
  internal: true
- platform: homeassistant
  id: ha_motion_hallway
  entity_id: binary_sensor.hallway_motion_occupancy
  internal: true
- platform: homeassistant
  id: ha_motion_bathroom
  entity_id: binary_sensor.bathroom_motion_occupancy
  internal: true
- platform: homeassistant
  id: ha_motion_laundry_room
  entity_id: binary_sensor.laundry_room_motion_occupancy
  internal: true
interval:
- interval: 1s
  then:
  - lambda: !lambda |-
      const bool online = id(ha_api).is_connected_with_state_subscription();
      auto number = [&](lv_obj_t *label, float value, const char *format) {
        if (!online || !std::isfinite(value)) lv_label_set_text(label, "--");
        else lv_label_set_text_fmt(label, format, value);
      };
      number(id(power_value), id(ha_power).state, "%.0f W");
      number(id(phase_a_value), id(ha_phase_a).state, "%.0f W");
      number(id(phase_b_value), id(ha_phase_b).state, "%.0f W");
      number(id(phase_c_value), id(ha_phase_c).state, "%.0f W");
      number(id(import_value), id(ha_import).state, "%.2f kWh");
      number(id(export_value), id(ha_export).state, "%.2f kWh");
      number(id(grace_value), id(ha_grace).state, "Grace: %.0f s");
      number(id(lux_value), id(ha_lux).state, "Lux now: %.0f lx");
      number(id(threshold_value), id(ha_threshold).state, "Threshold: %.0f lx");
      lv_label_set_text_fmt(id(location_value), "Location: %s", online ? id(ha_location).state.c_str() : "HA disconnected");
      lv_label_set_text_fmt(id(room_value), "Room: %s", online ? id(ha_room).state.c_str() : "HA disconnected");
      { const auto &s = id(ha_motion_living_room).state;
        lv_label_set_text_fmt(id(motion_living_room_value), "Living room: %s", !online ? "--" : s == "on" ? "Motion" : s == "off" ? "Clear" : "--");
        lv_obj_set_style_text_color(id(motion_living_room_value), lv_color_hex(online && s == "on" ? 0x58D8C5 : 0xA5B3C1), 0);
      }
      { const auto &s = id(ha_motion_hallway).state;
        lv_label_set_text_fmt(id(motion_hallway_value), "Hallway: %s", !online ? "--" : s == "on" ? "Motion" : s == "off" ? "Clear" : "--");
        lv_obj_set_style_text_color(id(motion_hallway_value), lv_color_hex(online && s == "on" ? 0x58D8C5 : 0xA5B3C1), 0);
      }
      { const auto &s = id(ha_motion_bathroom).state;
        lv_label_set_text_fmt(id(motion_bathroom_value), "Bathroom: %s", !online ? "--" : s == "on" ? "Motion" : s == "off" ? "Clear" : "--");
        lv_obj_set_style_text_color(id(motion_bathroom_value), lv_color_hex(online && s == "on" ? 0x58D8C5 : 0xA5B3C1), 0);
      }
      { const auto &s = id(ha_motion_laundry_room).state;
        lv_label_set_text_fmt(id(motion_laundry_room_value), "Laundry: %s", !online ? "--" : s == "on" ? "Motion" : s == "off" ? "Clear" : "--");
        lv_obj_set_style_text_color(id(motion_laundry_room_value), lv_color_hex(online && s == "on" ? 0x58D8C5 : 0xA5B3C1), 0);
      }
      { const auto &s = id(state_auto_button).state;
        const bool valid = online && (s == "on" || s == "off");
        if (valid) lv_obj_remove_state(id(auto_button), LV_STATE_DISABLED); else lv_obj_add_state(id(auto_button), LV_STATE_DISABLED);
        lv_obj_set_style_bg_color(id(auto_button), lv_color_hex(s == "on" && valid ? 0xDBAE50 : 0x344252), 0);
        lv_obj_set_style_text_color(id(auto_button), lv_color_hex(s == "on" && valid ? 0x101820 : 0xF1F5F9), 0);
        lv_label_set_text(lv_obj_get_child(id(auto_button), 0), !valid ? "Automation: --" : s == "on" ? "Automation: ON" : "Automation: OFF");
      }
      { const auto &s = id(state_living).state;
        const bool valid = online && (s == "on" || s == "off");
        if (valid) lv_obj_remove_state(id(living), LV_STATE_DISABLED); else lv_obj_add_state(id(living), LV_STATE_DISABLED);
        lv_obj_set_style_bg_color(id(living), lv_color_hex(s == "on" && valid ? 0xDBAE50 : 0x344252), 0);
        lv_obj_set_style_text_color(id(living), lv_color_hex(s == "on" && valid ? 0x101820 : 0xF1F5F9), 0);
      }
      { const auto &s = id(state_bed).state;
        const bool valid = online && (s == "on" || s == "off");
        if (valid) lv_obj_remove_state(id(bed), LV_STATE_DISABLED); else lv_obj_add_state(id(bed), LV_STATE_DISABLED);
        lv_obj_set_style_bg_color(id(bed), lv_color_hex(s == "on" && valid ? 0xDBAE50 : 0x344252), 0);
        lv_obj_set_style_text_color(id(bed), lv_color_hex(s == "on" && valid ? 0x101820 : 0xF1F5F9), 0);
      }
      { const auto &s = id(state_kitchen).state;
        const bool valid = online && (s == "on" || s == "off");
