# Two-tab panel for Waveshare ESP32-S3-Touch-LCD-4.3 (SKU 25948, original revision).
# Requires ESPHome 2026.8.2+ (LVGL 9) and HA permission to perform actions.
# The preset owns display reset; the binary light owns backlight pin 2.
substitutions:
  display_idle_timeout: 120s
esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
psram:
  mode: octal
  speed: 80MHz
logger:
  level: INFO
i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true
  frequency: 400kHz
ch422g:
- id: io_expander
output:
- platform: gpio
  id: backlight_output
  pin:
    ch422g: io_expander
    number: 2
light:
- platform: binary
  id: display_backlight
  output: backlight_output
  restore_mode: ALWAYS_ON
  internal: true
display:
- platform: mipi_rgb
  model: ESP32-S3-TOUCH-LCD-4.3
  id: panel_display
  enable_pin: []
  update_interval: never
  auto_clear_enabled: false
touchscreen:
- platform: gt911
  id: panel_touch
  display: panel_display
  interrupt_pin: GPIO4
  reset_pin:
    ch422g: io_expander
    number: 1
  on_touch:
  - logger.log:
      level: DEBUG
      format: 'Touch: x=%d y=%d'
      args:
      - touch.x
      - touch.y
image:
- platform: file
  file: ../www/images/floorplan-dark.png
  id: floorplan
  resize: 552x233
  type: RGB565
lvgl:
  id: panel_ui
  # LVGL resumes on touch release, consuming the tap that wakes the panel.
  resume_on_input: true
  on_idle:
    timeout: ${display_idle_timeout}
    then:
    - lvgl.pause:
  on_pause:
  - light.turn_off: display_backlight
  - logger.log:
      level: INFO
      format: Display sleeping after inactivity
  on_resume:
  - light.turn_on: display_backlight
  - logger.log:
      level: INFO
      format: Display awake
  displays:
  - panel_display
  touchscreens:
  - panel_touch
  buffer_size: 25%
  color_depth: 16
  default_font: montserrat_18
  bg_color: 1054752
  text_color: 15857145
  widgets:
  - tabview:
      id: main_tabs
      x: 0
      y: 0
      width: 800
      height: 480
      size: 48
      pad_all: 0
      bg_color: 1054752
      tab_style:
        bg_color: 1911093
        items:
          text_color: 10859457
          checked:
            bg_opa: COVER
            bg_color: 5822661
            text_color: 1054752
      content_style:
        pad_all: 0
        bg_color: 1054752
      tabs:
      - name: Energy
        pad_all: 0
        scrollable: false
        bg_color: 1054752
        widgets:
        - label:
            text: HOME ENERGY
            x: 16
            y: 16
            text_font: montserrat_16
            text_color: 10859457
        - label:
            text: Shelly Pro 3EM
            x: 570
            y: 16
            text_font: montserrat_16
            text_color: 10859457
            width: 210
            long_mode: DOT
        - obj:
            x: 16
            y: 50
            width: 768
            height: 140
            bg_color: 1911093
            border_width: 0
            radius: 12
            pad_all: 0
            scrollable: false
            widgets:
            - label:
                text: Power now
