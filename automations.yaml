- id: hallway_light_on
  alias: 'Presence: Hallway motion -> hallway on'
  description: ''
  triggers:
  - entity_id: binary_sensor.hallway_motion_occupancy
    to: 'on'
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.presence_enabled
    state: 'on'
  actions:
  - target:
      entity_id: light.hallway_light
    action: light.turn_on
  mode: single
- id: hallway_light_off
  alias: 'Presence: Hallway motion clear -> hallway off'
  description: >-
    Off after hallway motion has been continuously OFF for 60 s. Any
    motion-on within the window resets the timer, so dwelling (hanging
    laundry, putting on shoes) keeps the light lit as long as the PIR
    fires within the minute.
  triggers:
  - trigger: state
    entity_id: binary_sensor.hallway_motion_occupancy
    to: 'off'
    for:
      seconds: 60
  conditions:
  - condition: state
    entity_id: input_boolean.presence_enabled
    state: 'on'
  - condition: state
    entity_id: light.hallway_light
    state: 'on'
  actions:
  - target:
      entity_id: light.hallway_light
    action: light.turn_off
  mode: single
- id: room_light_on_and_track
  alias: 'Presence: Room motion -> light on + track room (Layer 1)'
  description: >-
    On any tracked room motion (and only when input_boolean.presence_enabled
    is on), set current_room and turn on that room's light. The grace-period
    cleanup of OTHER rooms is handled by room_cleanup_after_settle (Layer
    1b), which triggers on current_room state CHANGE.
  triggers:
  - entity_id: binary_sensor.living_room_motion_occupancy
    to: 'on'
    trigger: state
    id: living_room
  - entity_id: binary_sensor.bathroom_motion_occupancy
    to: 'on'
    trigger: state
    id: bathroom
  - entity_id: binary_sensor.laundry_room_motion_occupancy
    to: 'on'
    trigger: state
    id: laundry_room
  conditions:
  - condition: state
    entity_id: input_boolean.presence_enabled
    state: 'on'
  actions:
  - variables:
      new_room: "{{ trigger.id }}"
      rooms:
        living_room: light.living_room
        bathroom: light.bathroom_light
        laundry_room: light.laundry_room_light
  # Last edge wins. Update current_room even when the daylight gate skips
  # the light: otherwise daylight LR motion leaves current_room pinned on
  # the previous room, room_cleanup_after_settle never fires, and the
  # previous room's light gets orphaned (e.g. bathroom stays on for hours).
  #
  # There is deliberately NO co-fire guard here (removed 2026-09-05). From
  # 2026-06-17 to 2026-09-05 this held current_room whenever a second
  # tracked PIR was already on, on the theory that a genuine transition
  # clears the old room's PIR first. That theory is false. Measured from
  # the recorder: the LR Hue PIR latches ~10 s after last motion (9.90,
  # 9.95, 9.95, 9.95 s across four events) while an LR -> hallway ->
  # bathroom walk takes 4-6 s. The old room's PIR is ALWAYS still on when
  # you arrive, so the guard suppressed every real transit – current_room
  # never claimed the bathroom, never changed back, R1b never armed, and
  # the lamp stayed on indefinitely (3x on 2026-09-05). Gating the light
  # on it as well only traded that orphan for a 16.3 s delay on arrival.
  #
  # The incident the guard was built for (2026-06-17: R1b darkened the LR
  # on a seated user after a cross-fire) is handled downstream instead, by
  # R1b's presence-confirm gate, which landed after this guard: R1b
  # refuses to clean up when current_room's own PIR is dead – exactly the
  # cross-fire signature. A wrongly-claimed room now self-heals on the
  # next real motion edge instead of sticking forever.
  - target:
      entity_id: input_select.current_room
    data:
      option: "{{ new_room }}"
    action: input_select.select_option
  # LR-only daylight gate: skip turning on the living room lamp when the
  # PIR's own illuminance reading is at or above the threshold slider.
  # Other rooms (bathroom, laundry) have no usable daylight so they stay
  # unconditional. Sensor missing/unavailable -> treat as dark (float(0))
  # so a flaky sensor never traps the room in the dark.
  #
  # Night bypass: when sun is below horizon, ignore the lux gate entirely.
  # The Hue PIR only pushes a new illuminance reading on motion events, so
  # when R1b turns the LR lamp off while you're in the bathroom, the
  # PIR's last reading is still the lamp's own spill (~25 lx) and lags
  # the real darkness by hundreds of ms after re-entry – just long enough
  # to lose the race against the motion trigger. Daylight gating has no
  # purpose at night anyway: there is no daylight.
  - if:
    - condition: template
      value_template: >-
        {{ trigger.id != 'living_room'
           or is_state('sun.sun', 'below_horizon')
           or states('sensor.living_room_motion_illuminance')|float(0)
              < states('input_number.light_on_lux_threshold')|float(50) }}
    then:
    - target:
        entity_id: "{{ rooms[new_room] }}"
      action: light.turn_on
  mode: single
- id: room_cleanup_after_settle
  alias: 'Presence: Cleanup non-current rooms after settle (Layer 1b)'
  description: >-
    Fires when current_room transitions to a tracked room AND stays there
    for presence_grace_seconds. Turns off the lights of every other tracked
    room. Decoupled from motion triggers so brief motion-on/off cycles
    within the same room (LR PIR pirOToUDelay=5s causes off->on every few
    seconds while user sits) don't restart the timer - only entering a
    DIFFERENT room does.
  # State trigger fires when current_room transitions into one of the
  # tracked rooms and stays there for grace. HA's `to: [list]` with for:
  # has two known quirks:
  #   1. when state moves between two values that both match to:, the
  #      timer doesn't reset – it fires with `trigger.to_state` set to
  #      the FIRST match, not the current value.
  #   2. per-room triggers (one per to: value) can race: an old timer
  #      may not cancel cleanly when state moves to a different to:
  #      value, causing two stale fires.
  # Mitigation: use a single list-form trigger and read current_room
  # *live* in the action body. The `for:` semantics still wait for the
  # entity to remain inside the to: set, which is what we want.
  triggers:
  - trigger: state
    entity_id: input_select.current_room
    to:
    - living_room
    - bathroom
    - laundry_room
    for:
      seconds: "{{ states('input_number.presence_grace_seconds')|float(180)|int }}"
  conditions:
  - condition: state
    entity_id: input_boolean.presence_enabled
    state: 'on'
  actions:
  - variables:
      current: "{{ states('input_select.current_room') }}"
      # Presence-confirm the room we're about to KEEP before nuking the
      # others. current_room is confirmed when its own PIR is live, OR when
      # it's the living room.
      #
      # Why the LR is exempt: it's home base and its PIR has a documented
      # blind spot – a still occupant reads as 'off' (see test_blind_spot).
      # Gating LR-driven cleanup on the LR PIR would strand bathroom/laundry
      # lights on every time you settle motionless on the sofa. Turning OTHER
      # rooms off while current_room is the LR is always safe.
      #
      # Why bathroom/laundry are NOT exempt (bug 2026-06-2x): a transient
      # 15-20 s PIR blip there (sensor cross-fire) flips current_room while
      # the user is actually sat in the LR. The co-fire guard in Layer 1
      # blocks the *simultaneous* case, but a lone blip during an LR PIR
      # off-window slips through, and the subsequent LR re-fire can't self-
      # heal because the blip is still on. 180 s later R1b turned the LR off
      # on a seated user. Requiring current_room's own PIR to be live means a
      # blip that has already cleared can't be trusted to darken the room you
      # are really in – a genuine stay keeps that PIR firing.
      confirmed: >-
        {{ current == 'living_room'
           or is_state('binary_sensor.' ~ current ~ '_motion_occupancy', 'on') }}
      rooms:
        living_room: light.living_room
        bathroom: light.bathroom_light
        laundry_room: light.laundry_room_light
  - if:
    - condition: template
      value_template: "{{ confirmed }}"
    then:
    - repeat:
        for_each: "{{ rooms.keys() | reject('eq', current) | list }}"
        sequence:
        - if:
          # Turn a room off only when its light is on (else no-op) AND its
          # PIR is currently off. Never darken a room still reporting motion.
          - condition: template
            value_template: >-
              {{ is_state(rooms[repeat.item], 'on')
                 and is_state('binary_sensor.' ~ repeat.item ~ '_motion_occupancy', 'off') }}
          then:
          - target:
              entity_id: "{{ rooms[repeat.item] }}"
            action: light.turn_off
  mode: single
- id: hallway_dwell_turnoff
  alias: 'Presence: Hallway dwell -> turn off current room (Layer 2)'
  description: >-
    Fires when every tracked room has been 'off' for 90s and the hallway PIR
    is currently 'on', i.e. the user is genuinely dwelling in the hallway
    (hanging laundry, tying shoes) rather than transiting. Any tracked-room
    motion during the window resets the timer, so arrival sequences like
    LR->hallway->laundry->hallway->LR don't trigger this. On fire, turn off
    current_room's light and reset current_room to none.
  triggers:
  - trigger: state
    entity_id: binary_sensor.tracked_rooms_motion
    to: 'off'
    for:
      seconds: 90
  conditions:
  - condition: state
    entity_id: input_boolean.presence_enabled
    state: 'on'
  - condition: state
    entity_id: binary_sensor.hallway_motion_occupancy
    state: 'on'
  actions:
  - variables:
      current: "{{ states('input_select.current_room') }}"
      rooms:
        living_room: light.living_room
        bathroom: light.bathroom_light
        laundry_room: light.laundry_room_light
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ current in rooms }}"
      sequence:
      - target:
          entity_id: "{{ rooms[current] }}"
        action: light.turn_off
      - target:
          entity_id: input_select.current_room
        data:
          option: none
        action: input_select.select_option
  mode: single
- id: leave_home_lights_off
  alias: 'Presence: Leave home -> all lights off'
  description: >-
    Primary: person.antek not_home for 2 minutes (WiFi-based via UniFi).
    Fallback: all motion sensors off for 10 minutes AND person.antek is
    affirmatively not_home. Turns everything off. No snapshot/restore – on
    return, room motion just triggers Layer 1 normally.
  triggers:
  - entity_id: person.antek
    to: not_home
    for:
      minutes: 2
    trigger: state
    id: person_left
  - trigger: state
    entity_id: binary_sensor.all_rooms_motion
    to: 'off'
    for:
      minutes: 10
    id: no_motion
  conditions:
  - condition: state
    entity_id: input_boolean.presence_enabled
    state: 'on'
  - condition: or
    conditions:
    - condition: trigger
      id: person_left
    - condition: and
      conditions:
      - condition: trigger
        id: no_motion
      # Require an affirmative not_home, never "anything but home"
      # (bug 2026-08-18): UniFi kept re-creating the phone's entity on
      # private-MAC rotation until person.antek lost its tracker links
      # and stuck at 'unknown'. The old not(home) condition treated that
      # as away, so every 10-min still-sitting window (LR PIR blind
      # spot) fired leave-home – 23 all-lights-off events in one day
      # with the user on the sofa. 'unknown' means NO data: refusing to
      # darken the house on no data costs at most some wasted watts
      # while genuinely away, never a blackout on an occupant.
      - condition: state
        entity_id: person.antek
        state: not_home
  actions:
  - target:
      entity_id:
      - light.hallway_light
      - light.living_room
      - light.bathroom_light
      - light.laundry_room_light
      - light.kitchenette_light
      - light.bedroom_light
    action: light.turn_off
  - target:
      entity_id: switch.balcony_switch_l1
    action: switch.turn_off
  - target:
      entity_id: input_select.current_room
    data:
      option: none
    action: input_select.select_option
  mode: single
- id: living_room_switch_toggle
  alias: 'Switch: Living room toggle + all others off'
  description: >-
    Hue dimmer switch on_press toggles living room lights and turns off all other
    lights. off_press turns off everything including living room.
  triggers:
  - trigger: mqtt
    topic: zigbee2mqtt/Living Room Switch/action
    payload: on_press
    id: 'on'
  - trigger: mqtt
    topic: zigbee2mqtt/Living Room Switch/action
    payload: off_press
    id: 'off'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: 'on'
      sequence:
      - action: light.toggle
        target:
          entity_id: light.living_room
      - action: light.turn_off
        target:
          entity_id:
          - light.hallway_light
          - light.bathroom_light
          - light.laundry_room_light
          - light.kitchenette_light_strip
      - action: switch.turn_off
        target:
          entity_id: switch.balcony_switch_l1
    - conditions:
      - condition: trigger
        id: 'off'
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.living_room
          - light.hallway_light
          - light.bathroom_light
          - light.laundry_room_light
          - light.kitchenette_light_strip
      - action: switch.turn_off
        target:
          entity_id: switch.balcony_switch_l1
  mode: single
- id: push_config_on_shutdown
  alias: 'System: Push config to GitHub on shutdown'
  description: >-
    Commits and pushes any uncommitted config changes to GitHub before HA shuts
    down. Catches UI-initiated automation edits between git_pull cycles.
  triggers:
  - trigger: homeassistant
    event: shutdown
  actions:
  - action: shell_command.push_config
  mode: single
- id: laundry_room_switch_toggle
  alias: 'Switch: Laundry room switch -> toggle laundry room light'
  description: >-
    ZBMINIR2 with detach_relay_mode=true + external_trigger_mode=following(off),
    wall switch (Gira) wired to S2 input. Each Gira flip publishes
    action=toggle on zigbee2mqtt/Laundry Room Switch/action; mirror onto the
    Hue bulb. State-based triggers won't work here because the relay is detached
    and only emits action events, not OFF<->ON state transitions.
  triggers:
  - trigger: mqtt
    topic: zigbee2mqtt/Laundry Room Switch/action
    payload: toggle
  actions:
  - action: light.toggle
    target:
      entity_id: light.laundry_room_light
  mode: single
- id: hallway_switch_toggle
  alias: 'Switch: Hallway switches A/B -> toggle hallway light'
  description: >-
    Two ZBMINIR2 devices in the smart-bulb-safe topology – Hue bulb
    permanently powered (bypassed around both relays), each device's S1
    wired to its own physical wall switch (one at each end of the
    hallway). Z2M device config: external_trigger_mode=edge; A is in
    pass-through relay mode and B has detach_relay_mode=on – doesn't
    matter, the bulb is bypassed either way, and both still emit
    action=toggle on their own topic per edge. Mirror either topic onto
    the Hue bulb. Toggling either relay via Z2M's UI is purely cosmetic
    and does nothing to the light (intentional: power-cycling Hue bulbs
    every flip, like the laundry's current behaviour, breaks Adaptive
    Lighting and races HA's Zigbee commands). Manual override coexists
    with presence: a manual ON sticks until the next 60-s motion-off
    cycle clears it via `hallway_light_off`; a manual OFF sticks until
    hallway motion next transitions off->on and re-fires
    `hallway_light_on`.
  triggers:
  - trigger: mqtt
    topic: zigbee2mqtt/Hallway Switch A/action
    payload: toggle
  - trigger: mqtt
    topic: zigbee2mqtt/Hallway Switch B/action
    payload: toggle
  actions:
  - action: light.toggle
    target:
      entity_id: light.hallway_light
  mode: single
- id: kitchenette_switch_toggle
  alias: 'Switch: Kitchenette switch -> sync kitchenette light strip (TRÅDFRI)'
  description: >-
    ZBMINIL2 with relay physically bypassed. Syncs the TRÅDFRI strip to the
    switch's reported state instead of toggling on every MQTT action, so
    spurious/phantom action events from the modded switch can't flip the light.
  triggers:
  - trigger: state
    entity_id: switch.kitchenette_switch
    from: 'off'
    to: 'on'
    id: 'on'
  - trigger: state
    entity_id: switch.kitchenette_switch
    from: 'on'
    to: 'off'
    id: 'off'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: 'on'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.kitchenette_light_strip
    - conditions:
      - condition: trigger
        id: 'off'
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.kitchenette_light_strip
  mode: single
